app.upload.dir=uploads/resumes

# ===== JWT =====
app.jwt.secret=ThisIsASecretKeyForJobPortalApplicationChangeItInProduction123456
app.jwt.expiration-ms=86400000

# ===== CORS =====
app.cors.allowed-origins=http://localhost:3000
